<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Criar nova senha — MetaClean</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="mc-header"></div>
<main class="auth">
  <h1>Criar nova senha</h1>
  <p class="sub">Escolha uma nova senha com pelo menos 8 caracteres.</p>
  <div>
    <form id="f" novalidate>
      <div class="msg" role="alert"></div>
      <label>Nova senha
        <input name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
      </label>
      <label>Repita a nova senha
        <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit">Salvar nova senha</button>
    </form>
  </div>
  <div class="links">
    <a href="/login.html">Voltar para entrar</a>
    <a href="/esqueci-senha.html">Pedir novo link</a>
  </div>
</main>
<div id="mc-footer"></div>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
<script type="module">
  const form = document.getElementById('f');
  const msg = form.querySelector('.msg');
  const btn = form.querySelector('button[type=submit]');

  // O link do e-mail já foi processado pelo app.js; aqui só conferimos se deu certo.
  btn.disabled = true;
  MC.ready.then(user => {
    if (MC.hasInvite()) {
      document.querySelector('h1').textContent = 'Criar sua senha';
      document.querySelector('p.sub').textContent = 'Você foi convidado para o MetaClean. Escolha uma senha com pelo menos 8 caracteres.';
    }
    if (user || MC.hasInvite()) { btn.disabled = false; return; }
    msg.textContent = 'Link inválido ou expirado. Peça um novo em "Esqueci minha senha".';
    msg.className = 'msg show err';
  });

  MC.bindForm(form, 'reset', {
    extra: b => (b.password || '').length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.'
      : b.password !== b.confirm ? 'As senhas não são iguais.' : '',
    onOk: (_, show) => {
      show('Senha salva com sucesso! Abrindo o limpador…', 'ok');
      setTimeout(() => { location.href = MC.config.PAGINA_LIMPADOR; }, 1500);
    },
  });
</script>
</body>
</html>
