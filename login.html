<!doctype html>
<html lang="pt-BR" data-auth="guest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — MetaClean</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="mc-header"></div>
<main class="auth">
  <h1>Entrar</h1>
  <p class="sub">Acesse sua conta MetaClean.</p>
  <div>
    <form id="f" novalidate>
      <div class="msg" role="alert"></div>
      <label>E-mail
        <input name="email" type="email" autocomplete="email" required autofocus>
      </label>
      <label>Senha
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <div class="links">
    <a href="/esqueci-senha.html">Esqueci minha senha</a>
    <a href="/">Criar conta</a>
  </div>
</main>
<div id="mc-footer"></div>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
<script type="module">
  MC.bindForm(document.getElementById('f'), 'login', {
    extra: b => (!b.email || !b.password) ? 'Preencha e-mail e senha.' : '',
    onOk: () => { location.href = MC.config.PAGINA_LIMPADOR; },
  });
</script>
</body>
</html>
