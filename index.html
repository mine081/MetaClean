<!doctype html>
<html lang="pt-BR" data-auth="guest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — MetaClean</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="mc-header"></div>
<main class="auth">
  <h1>Criar conta</h1>
  <p class="sub">Crie sua conta grátis para usar o limpador de metadados de vídeo. Use seu e-mail e escolha uma senha com pelo menos 8 caracteres.</p>
  <div>
    <form id="f" novalidate>
      <div class="msg" role="alert"></div>
      <label>E-mail
        <input name="email" type="email" autocomplete="email" required autofocus>
      </label>
      <label>Senha
        <input name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Repita a senha
        <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit">Criar conta</button>
    </form>
  </div>
  <div class="links">
    <span></span>
    <a href="/login.html">Já tenho conta</a>
  </div>
</main>
<div id="mc-footer"></div>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
<script type="module">
  MC.bindForm(document.getElementById('f'), 'register', {
    extra: b => !b.email ? 'Digite seu e-mail.'
      : (b.password || '').length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.'
      : b.password !== b.confirm ? 'As senhas não são iguais.' : '',
    onOk: (d, show) => {
      if (d.pending) show('Conta criada! Enviamos uma mensagem de confirmação para o seu e-mail. Clique no link dela para ativar a conta: você entra direto no limpador de metadados.', 'ok');
      else location.href = MC.config.PAGINA_LIMPADOR;
    },
  });
</script>
</body>
</html>
